; NBD Export — Network Block Device export + image jobs
; Live: /boot/config/plugins/NBDExport/NBDExport.cfg

; Master switch: No stops new exports (and stops running on Apply)
enabled="yes"

; Default read-only for new exports (strongly recommended)
default_read_only="yes"

; Default TCP port for qemu-nbd
default_port="10809"

; Allow binding 0.0.0.0 (dangerous; requires explicit confirm in UI)
allow_bind_all="no"

; Destructive mode (UD-style): allow writable exports and array/mounted disks.
; Default No — RO exports of non-array disks only.
destructive_mode="no"

; Rehydrate remembered auto-start exports on array start (still RO only by default)
rehydrate_on_start="no"

; Optional extra private CIDRs for Pull → Scan network (comma-separated).
; Use when peers sit on a LAN you can route to but this host has no interface/route entry
; (e.g. scanner only on 192.168.254.0/24, host export on 192.168.1.0/24 via NAT).
; Example: scan_extra_subnets="192.168.1.0/24"
scan_extra_subnets=""

; Opt-in: show small "NBD RO" / "NBD RW" text on Main → Unassigned Devices for disks
; currently hosted by this plugin. Default No. Best-effort DOM overlay on a third-party
; page (Unassigned Devices) — layout can change with UD updates; not a formal API.
ud_status_overlay="no"
